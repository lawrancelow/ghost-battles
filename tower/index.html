  P.joy = function(gi, jx, jy){

    g.joying=true;
    var ux=jx/mag, uy=jy/mag;
    if (g.edge){
      var E=g.edge, dx=E.to.x-E.from.x, dy=E.to.y-E.from.y, L=Math.hypot(dx,dy)||1, d=(dx*ux+dy*uy)/L;

  // ---------- 更新 ----------
  P.update = function(dt){

    for (var i=this.fx.length-1;i>=0;i--){ this.fx[i].t+=dt; if (this.fx[i].t>1.8) this.fx.splice(i,1); }
    // 户：香、拜神、宵夜
    for (var k in this.units){ var U=this.units[k];
      if (U.incense>0) U.incense=Math.max(0,U.incense-dt);
      if (U.praying>0) U.praying=Math.max(0,U.praying-dt);
      if (U.flicker>0) U.flicker=Math.max(0,U.flicker-dt);
      if (U.supper && !U.supper.eaten && this.t>=U.supper.eatAt){
        var here=U.residents.filter(function(r){return r.state!=='flee' && r.state!=='hide' && r.state!=='shower';});
        if (here.length){ U.supper.eaten=true; U.supper.byHuman=true; }
      }
      for (var p=0;p<U.prayAt.length;p++){ if (U.prayAt[p]!==null && this.t>=U.prayAt[p]){ U.prayAt[p]=null;
        var pr=U.residents.filter(function(r){return r.state==='tv'||r.state==='sleep'||r.state==='night';})[0];
        if (pr){ pr.state='pray'; pr.busy=4; pr.path=this.pathOrNull(pr,'L'+U.id); pr.scheduled=true; } } }
      U.light.L = U.residents.some(function(r){return r.node==='L'+U.id && (r.state==='tv'||r.state==='pray'||r.state==='night'||r.state==='eat'||r.state==='check'||r.state==='salt');})?1:0;
      U.light.B = U.residents.some(function(r){return r.node==='B'+U.id && (r.state==='check'||r.state==='hide');})?1:0;
    }
    this.residents.forEach(function(r){ self.updResident(r,dt); });
    this.guards.forEach(function(g){ self.updGuard(g,dt); });
    this.updDatuk(dt);
    this.ghosts.forEach(function(g,i){ self.updGhost(g,i,dt); });
    // 掉落物过期
    for (var j=this.items.length-1;j>=0;j--){ var it=this.items[j]; if (it.type==='drop'){ it.ttl-=dt; if (it.ttl<=0){ this.items.splice(j,1); this.toast('掉在'+it.where+'的东西被保安收走了'); } } }

    if (this.t>=NIGHT-1/60){ this.endNight(); }
  };

  P.moveAlong = function(who, dt, speed, kind){

      var nxt=who.path[0]; var e=this.findEdge(who.node,nxt);

      if (kind && kind!=='human' && kind!=='guard' && !this.edgeOpen(e,kind,GR.idx[who.node])){ who.path=[]; this.float(who.x,who.y-70,'路被挡住了','#ff9a9a'); return false; }

    }

    who.et += speed*dt/len;
    if (who.et>=1){ who.node=E.to.id; who.x=E.to.x; who.y=E.to.y; who.edge=null; who.path.shift(); return true; }
    who.x = E.from.x+(E.to.x-E.from.x)*who.et; who.y = E.from.y+(E.to.y-E.from.y)*who.et;

  P.inCone = function(c, gh, warn){

    var gn=GR.idx[gh.node]; var gl=gn.lane; if (gh.edge) gl = gh.edge.to.lane===gh.edge.from.lane?gh.edge.to.lane:'mix';
    var cf = c.lane, sameBand = false;

    if (dx*c.dir<0) return false;

    if (cband==='room'){ var gu=Math.floor((gh.x-100)/113), cu=Math.floor((c.x-100)/113); if (gu!==cu) return false; }
    return Math.abs(Math.atan2(dy, Math.abs(dx)))<A || d<26;
  };
  P.ghostVisible = function(gh){
    if (gh.hide) return false;
    var n=GR.idx[gh.node];
    if (!gh.edge && (n.lane==='ceil'||n.lane==='shaft') && !gh.hang) return false;
    if (gh.edge && (gh.edge.e.type==='ceil'||gh.edge.e.type==='shaft'||gh.edge.e.type==='climb')) return false;
    return true;
  };
  P.guardSee = function(g, dt){
    var c=this.guardCone(g); if(!c) return;
    var self=this;
    this.ghosts.forEach(function(gh){
      if (!self.ghostVisible(gh) || gh.respawn>0) return;
      if (self.inCone(c,gh,false)){
        gh.exposure+=dt; gh.lit=true; gh.reveal=Math.max(gh.reveal,0.5);
        if (!gh.warned){ gh.warned=true; self.float(gh.x,gh.y-90,'被手电照到！','#ffd54a'); var f=GR.idx[gh.node].f||1; self.raiseAlert(2,f,g.name+'的手电照到了'+gh.name+'！搜捕开始'); }
        if (gh.exposure>=2) self.catchGhost(gh, '被'+g.name+'抓到');
      }
    });
  };
  P.updDatuk = function(dt){
    var self=this;
    this.datuk.forEach(function(d){
      if (d.done) return;
      if (!d.warned && self.t>=d.at-15){ d.warned=true; self.toast(d.f+'楼走廊传来铃声和檀香——拿督公要巡视了'); }
      if (self.t>=d.at){
        if (d.sweep<0) d.sweep=0;
        d.sweep += dt/8;
        d.x = W - d.sweep*(W+60);
        self.ghosts.forEach(function(gh){
          var n=GR.idx[gh.node]; if (gh.stun>0||gh.respawn>0) return;
          var lane = gh.edge? (gh.edge.to.lane===gh.edge.from.lane?gh.edge.to.lane:'mix') : n.lane;
          var f = gh.edge? (gh.edge.to.f) : n.f;
          if ((lane==='corr'||lane==='stair') && f===d.f && !gh.hide && Math.abs(gh.x-d.x)<34){
            gh.stun=3; gh.reveal=4; gh.path=[]; self.stats.datukHits++; self.float(gh.x,gh.y-95,'拿督公巡视：定身 3 秒','#ffd54a');
            self.raiseAlert(1,f,gh.name+'在'+f+'楼被拿督公照出原形');
          }
        });
        if (d.sweep>=1) d.done=true;
      }
    });
  };
  P.catchGhost = function(gh, why){
    this.stats.caught++;
    var c=gh.carry, drop={supper:[], money:0, stash:0};
    var ns=Math.floor(c.supper.length/2); drop.supper=c.supper.splice(c.supper.length-ns, ns);
    drop.money=Math.floor(c.money/2); c.money-=drop.money;
    if (c.stash){ drop.stash=c.stash; c.stash=0; }
    var n=GR.idx[gh.node];
    if (drop.supper.length||drop.money||drop.stash){
      this.items.push({type:'drop', owner:gh.id, x:gh.x, y:gh.y, f:n.f, node:gh.node, supper:drop.supper, money:drop.money, stash:drop.stash, ttl:75, where:(n.f?n.f+'楼':'楼下')});
      this.float(gh.x,gh.y-60,'东西掉了一半','#ff9a9a');
    }
    this.toast(gh.name+why+'，打回水箱，魂力减半');
    var t=GR.idx['TANK']; gh.node='TANK'; gh.edge=null; gh.path=[]; gh.x=t.x; gh.y=t.y; gh.hide=null; gh.ring=null; gh.hang=0;
    gh.soul=Math.max(10,Math.floor(gh.soul/2)); gh.exposure=0; gh.respawn=2; gh.stun=0; gh.warned=false;
  };
  P.updGhost = function(g, gi, dt){
    if (g.respawn>0) g.respawn-=dt;
    if (g.reveal>0) g.reveal-=dt;
    if (g.hang>0 && !g.ring) g.hang=Math.max(0,g.hang-dt);
    g.lit=false;
    if (g.channel){
      var ch=g.channel; ch.t+=dt;
      var still = this.takeable(g, GR.idx[g.node], g.channel.tk.unit.id, ch.room);
      if (g.edge || g.stun>0 || !still || still.kind!==ch.tk.kind || this.watchers(ch.tk.unit.id, ch.room).length){ g.channel=null; this.float(g.x,g.y-84,'被打断','#ff9a9a'); }
      else if (ch.t>=ch.dur){ g.channel=null; this.finishTake(g, still, ch.room); }
    }
    if (g.ring){ g.ring.t+=dt; if (g.ring.t>g.ring.dur+0.35){ var tg=g.ring.target; g.ring=null; g.hang=0; this.float(tg.x,tg.y-100,'错过时机','#ffb27a'); if(!tg.mode){ tg.sus=Math.min(100,tg.sus+10);} } }
    if (g.stun>0){ g.stun-=dt; g.soul=Math.max(0,g.soul-5*dt); if (g.stun<=0 && g.pushBack){ var pb=GR.idx[g.pushBack]; g.node=pb.id; g.x=pb.x; g.y=pb.y; g.edge=null; g.pushBack=null; } }
    else {
      var spd = DATA.ghosts[g.id].speed;
      if (g.id==='toyol') spd *= (1 - Math.min(0.5, (g.carry.money)/110));
      if (g.id==='eking') spd *= (1 - Math.min(0.25, g.carry.supper.length*0.07));
      var onGround=false;
      if (g.id==='tianhua'){
        var ln = g.edge ? g.edge.e.type : GR.idx[g.node].lane;
        onGround = !(ln==='ceil'||ln==='climb'||ln==='shaft'||ln==='roof'||ln==='drop');
        if (onGround) spd=55;
      }
      g.onGround=onGround;
      var prevNode=g.node;
      if (g.path.length && !g.hide) this.moveAlong(g,dt,spd,g.id);
      // 神光
      var n=GR.idx[g.node]; var lane = g.edge ? ((g.edge.from.lane==='room'||g.edge.to.lane==='room')?'room':'x') : n.lane;
      if (g.edge && g.edge.e.type==='drop') lane = g.et>0.6?'room':'x';
      var f = g.edge? (g.edge.to.f||g.edge.from.f) : n.f;
      var U = this.litAt(g.x, g.y, f, lane);
      if (!U && g.hang && n.lane==='ceil' && n.room){ U=this.litAt(GR.idx[n.room+n.f+'_'+n.u].x, GR.idx[n.room+n.f+'_'+n.u].y, n.f, 'room'); }
      if (U && g.respawn<=0 && !g.hide){
        g.stun=2; g.soul=Math.max(0,g.soul-10); this.stats.stunned++;
        var back = g.edge ? g.edge.from.id : prevNode;
        if (this.litNode(GR.idx[back])) back = g.edge? g.edge.from.id : (n.lane==='ceil'?n.id:'Cd'+U.id);
        if (n.lane==='ceil') back=n.id;
        g.pushBack = back; g.path=[]; g.ring=null; g.hang=0;
        this.float(g.x,g.y-90,'神光镇住！定身 2 秒','#ffe08a');
      }
      if (onGround) g.soul=Math.max(0,g.soul-4*dt);
    }
    if (g.node==='TANK' && !g.edge){
      g.soul=Math.min(100,g.soul+8*dt);
      var c=g.carry, any=false;
      if (c.supper.length){ g.done.supper=g.done.supper.concat(c.supper); c.supper=[]; any=true; }
      if (c.money){ g.done.money+=c.money; c.money=0; any=true; }
      if (c.stash){ g.done.stash+=c.stash; c.stash=0; any=true; }
      if (any){ this.float(g.x,g.y-80,'带回水箱，存好了','#9affc8'); if (this.commDone(g.id)) this.toast(g.name+'的委托完成！'); }
    }
    if (g.soul<=0 && g.respawn<=0){ this.catchGhost(g,'魂力耗尽'); }
  };
  P.commDone = function(id){
    var g=this.ghosts.filter(function(x){return x.id===id;})[0];
    if (id==='eking'){ var s={}; g.done.supper.forEach(function(u){s[u]=1;}); return Object.keys(s).length>=3; }
    if (id==='toyol') return g.done.money>=50;
    if (id==='tianhua') return g.done.stash>0;
  };
  P.commProgress = function(id){
    var g=this.ghosts.filter(function(x){return x.id===id;})[0];
    if (id==='eking'){ var s={}; g.done.supper.forEach(function(u){s[u]=1;}); return {done:Object.keys(s).length, carry:g.carry.supper.length, need:3}; }
    if (id==='toyol') return {done:g.done.money, carry:g.carry.money, need:50};
    return {done:g.done.stash?1:0, carry:g.carry.stash?1:0, need:1};
  };
  P.endNight = function(){
    if (this.over) return;
    this.over=true; var self=this;
    var res = this.ghosts.map(function(g){ return {id:g.id, name:g.name, text:self.comm[g.id].text, ok:self.commDone(g.id)}; });
    var n = res.filter(function(r){return r.ok;}).length;
    var stars = n;
    var xianghuo = n*100 + this.scares*10;
    this.result = {comms:res, done:n, scares:this.scares, guardScares:this.guardScares, stars:stars, xianghuo:xianghuo, caught:this.stats.caught};
  };

  return {Game:Game, GEO:GEO, GR:GR, NIGHT:NIGHT, rng:rng};
})();
if (typeof module !== 'undefined') module.exports = LYG_SIM;
</script>
<script>// 楼里有鬼 M1 — 画面 / 操作层
(function(){

  function writeSave(){ try { localStorage.setItem('lyg_m1', JSON.stringify(save)); } catch(e){} }

  // ---------- 资源 ----------

    keys.forEach(function(k){ var im=new Image(); im.onload=im.onerror=function(){ if(--left===0) cb(); }; im.src=LYG_IMG[k]; IMG[k]=im; });
  }
  function sprite(key, x, y, h, flip, alpha){

  }

  // ---------- 尺寸 ----------
  function resize(){
    VW = Math.min(window.innerWidth, 520); VH = window.innerHeight;

    cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);

  }

  // ---------- 静态层（每夜烘一次）----------
  function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  function bakeStatic(){
    var s=staticS; staticCv=document.createElement('canvas'); staticCv.width=Math.ceil(GEO.W*s); staticCv.height=Math.ceil(GEO.WH*s);

    c.fillStyle='#fff6d8'; c.beginPath(); c.arc(690,42,20,0,7); c.fill(); c.fillStyle=C.sky0; c.beginPath(); c.arc(681,36,18,0,7); c.fill();

    c.fillStyle='#5a6b7c'; c.fillRect(186,ry-60,88,6); c.fillRect(186,ry-36,88,6);
    c.strokeStyle=C.ink; c.lineWidth=2; c.beginPath(); c.moveTo(190,ry-4); c.lineTo(190,ry+4); c.moveTo(270,ry-4); c.lineTo(270,ry+4); c.stroke();
    c.fillStyle='#e9e2ff'; c.font='bold 13px '+FONT; c.textAlign='center'; c.fillText('栖身处·天台水箱',230,ry-80);

    c.strokeStyle='#8a7fa0'; c.lineWidth=2; c.beginPath(); c.moveTo(560,ry); c.lineTo(560,ry-50); c.moveTo(540,ry-40); c.lineTo(580,ry-40); c.moveTo(545,ry-28); c.lineTo(575,ry-28); c.stroke();

    // 保安亭
    c.fillStyle='#5e6f86'; rr(c,262,GEO.GROUND_Y-46,76,46,4); c.fill(); c.strokeStyle=C.ink; c.lineWidth=2.5; c.stroke();
    c.fillStyle='#1d2a3a'; c.fillRect(272,GEO.GROUND_Y-40,24,16); c.fillStyle='#7fb2d8'; c.fillRect(274,GEO.GROUND_Y-38,20,12);
    c.fillStyle='#fff'; c.font='bold 11px '+FONT; c.textAlign='center'; c.fillText('保安亭',300,GEO.GROUND_Y+14);

    var dx=700, dy=GEO.GROUND_Y;
    c.fillStyle='#b8262c'; rr(c,dx-26,dy-58,52,58,3); c.fill(); c.strokeStyle=C.ink; c.lineWidth=2.5; c.stroke();
    c.fillStyle='#e8b23a'; c.beginPath(); c.moveTo(dx-34,dy-56); c.lineTo(dx,dy-78); c.lineTo(dx+34,dy-56); c.closePath(); c.fill(); c.stroke();
    c.fillStyle='#f3c94b'; c.fillRect(dx-14,dy-46,28,26); c.strokeRect(dx-14,dy-46,28,26);
    c.fillStyle='#7a1414'; c.fillRect(dx-20,dy-14,40,8);

    c.fillText('楼梯',30,GEO.GROUND_Y-70); c.fillText('电梯井',80,GEO.GROUND_Y-70); c.restore();
    // 外框
    c.strokeStyle=C.ink; c.lineWidth=4; c.strokeRect(1,GEO.ROOF,GEO.W-2,GEO.FLOORS*GEO.RH+110);
  }
  function bakeFloor(c,f,R){

    c.fillStyle='#9aa3b2'; c.fillRect(64,GEO.yCorr(f)-56,32,54); c.strokeStyle=C.ink; c.lineWidth=2; c.strokeRect(64,GEO.yCorr(f)-56,32,54);

    // 栏杆（前景）
    c.strokeStyle='rgba(20,13,34,0.55)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(60,top+RH-22); c.lineTo(GEO.W,top+RH-22); c.stroke();

  function bakeUnit(c,f,u,R){

    // 客厅墙

    c.fillStyle='rgba(255,255,255,0.035)'; for (var s=0;s<113;s+=10) c.fillRect(x0+s,y0,4,100);

    c.lineWidth=3; c.beginPath(); c.moveTo(x0,y0); c.lineTo(x0+226,y0); c.stroke();

    else if (t.indexOf('恐惧+')>=0){ tone(110,0.25,'sine',0.14,60); }
    else if (t.indexOf('疑心')>=0){ tone(300,0.12,'square',0.025,240); }
    else if (t.indexOf('神光')>=0 || t.indexOf('拿督公巡视')>=0){ tone(196,1.2,'sine',0.1); tone(294,1.2,'sine',0.05); }
    else if (t.indexOf('手电')>=0){ tone(1000,0.12,'square',0.04); tone(1000,0.12,'square',0.04,null,0.18); }
    else if (t.indexOf('RM')>=0 || t.indexOf('吃掉')>=0 || t.indexOf('私房钱')>=0 || t.indexOf('魂力+')>=0){ tone(1400,0.08,'square',0.03); tone(2100,0.12,'square',0.03,null,0.07); }
    else if (t.indexOf('不怕')>=0){ tone(220,0.2,'triangle',0.05,180); }
  }
  function sfxToast(m){ if (!AC) return;
    if (m.indexOf('铃声')>=0){ for (var i=0;i<3;i++) tone(1568,0.6,'triangle',0.05,null,i*0.35); }
    else if (m.indexOf('抓到')>=0 || m.indexOf('耗尽')>=0){ tone(330,0.3,'sawtooth',0.05,160); tone(160,0.5,'sawtooth',0.05,80,0.25); }
    else if (m.indexOf('完成')>=0){ tone(660,0.15,'triangle',0.07); tone(880,0.15,'triangle',0.07,null,0.12); tone(1320,0.3,'triangle',0.07,null,0.24); }
    else if (m.indexOf('搜捕')>=0){ tone(700,0.2,'square',0.04,500); tone(700,0.2,'square',0.04,500,0.25); }
  }

  // ---------- 开局 ----------
  function newNight(){
    save.seed=(save.seed||1)+1; writeSave();
    game=new S.Game(save.seed);
    window.__game=game;
    game.onFx=sfxFx; bakeStatic(); overview=false; camManual=0; paused=false;
    var g=game.ghosts[0]; cam.x=g.x-VW/cam.zDefault/2; cam.y=g.y-200;
    scene='play'; recorded=false;
    seenTip={0:1}; game.toast('今晚三张委托。按住画面拖动就能移动：门口往上推进房，楼梯往上下推换楼层。点人选为目标。');
  }
  var recorded=false, seenTip={0:1};
  var GHOST_TIPS=['饿鬼王闻得到全楼的宵夜（金圈）。宵夜到时间会被住户吃掉，要赶。体型大，钻不了通风口和电梯井。',
    'Toyol 钻门缝和通风口，锁着的铁闸挡不住它，还能爬电梯井。金色硬币只有它看得到。身上钱越多飘得越慢。',
    '天花姐在天花夹层爬：盐挡不住，保安手电照不到。在房间上方按「吓」会倒挂吓人。下地太久会掉魂力。'];
  function onResult(){
    if (recorded) return; recorded=true;
    var r=game.result; save.nights++; save.best=Math.max(save.best,r.stars); save.xianghuo+=r.xianghuo; writeSave();
  }

  // ---------- 输入 ----------
  var ptr=null, joy=null; // joy：浮動虛擬搖桿（手指按落嘅位置做中心）
  var JOY_R=58;
  cv.addEventListener('pointerdown',function(e){ ac(); var p=pt(e); ptr={x:p.x,y:p.y,sx:p.x,sy:p.y,drag:false,id:e.pointerId};
    if (scene==='play' && !overview && !paused && p.y>TOP && p.y<VH-BOT){ joy={ox:p.x,oy:p.y,x:p.x,y:p.y,on:false}; }
    try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
  cv.addEventListener('pointermove',function(e){ if(!ptr) return; var p=pt(e);
    if (Math.hypot(p.x-ptr.sx,p.y-ptr.sy)>12) ptr.drag=true;
    if (joy){ joy.x=p.x; joy.y=p.y; if (ptr.drag) joy.on=true; } });
  function joyEnd(){ if (joy && game && scene==='play') game.joy(game.active,0,0); joy=null; }
  cv.addEventListener('pointerup',function(e){ if(!ptr) return; var p=pt(e), was=ptr; ptr=null; var wasJoy=joy&&joy.on; joyEnd(); if (!was.drag && !wasJoy) tap(p.x,p.y); });
  cv.addEventListener('pointercancel',function(){ ptr=null; joyEnd(); });
  function joyVec(){ if (!joy||!joy.on) return null; var dx=joy.x-joy.ox, dy=joy.y-joy.oy, L=Math.hypot(dx,dy); if (L>JOY_R){ dx*=JOY_R/L; dy*=JOY_R/L; } return {x:dx/JOY_R, y:dy/JOY_R}; }
  function drawJoy(){ if (!joy||!joy.on) return; var v=joyVec(); screenT();
    ctx.fillStyle='rgba(20,12,40,0.45)'; ctx.strokeStyle='rgba(200,180,255,0.55)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(joy.ox,joy.oy,JOY_R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(138,255,200,0.85)'; ctx.beginPath(); ctx.arc(joy.ox+v.x*JOY_R,joy.oy+v.y*JOY_R,24,0,Math.PI*2); ctx.fill(); }
  function pt(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  function tap(x,y){
    for (var i=0;i<buttons.length;i++){ var b=buttons[i]; if (x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ press(b.id); return; } }
    if (scene!=='play' || paused) return;
    if (y<TOP || y>VH-BOT) return;
    var w=toWorld(x,y), G=game, gi=G.active, g=G.ghosts[gi];
    if (overview){ overview=false; cam.z=cam.zDefault; cam.x=w.x-VW/cam.z/2; cam.y=w.y-viewH()/cam.z/2; clampCam(); camManual=3; return; }
    // 点人
    var hit=null;
    G.residents.concat(G.guards).forEach(function(r){ if (r.state==='shower'&&!r.edge) return; if (Math.abs(w.x-r.x)<20 && w.y<r.y+4 && w.y>r.y-58) hit=r; });
    if (hit){ g.target=hit; G.float(hit.x,hit.y-70,'选为目标','#ffd54a'); }
  }
  function press(id){
    var G=game;
    if (id==='start'){ newNight(); return; }
    if (id==='again'){ newNight(); return; }
    if (id==='title'){ scene='title'; return; }
    if (scene!=='play') return;
    if (id==='overview'){ overview=!overview; if(!overview){ cam.z=cam.zDefault; camManual=0; } return; }
    if (id.indexOf('ghost')===0){ var i=+id.slice(5); G.active=i; camManual=0; overview=false;
      if (!seenTip[i]){ seenTip[i]=1; G.toast(GHOST_TIPS[i]); } return; }
    if (id==='finish'){ G.endNight(); return; }
    if (id==='pause'){ paused=!paused; return; }
    if (id==='scare') G.scarePress(G.active);
    if (id==='take') G.takePress(G.active);
    if (id==='hide') G.hidePress(G.active);
    if (id==='radio') G.radioPress(G.active);
  }

  // ---------- 主循环（限 30fps）----------
  var last=0, acc=0;
  function frame(ts){
    requestAnimationFrame(frame);
    if (!last) last=ts; var dt=(ts-last)/1000; if (dt<1/31) return; last=ts; dt=Math.min(dt,0.1);
    animT+=dt;
    if (tapMark) tapMark.t-=dt*1.5;
    if (scene==='title'){ drawTitle(); return; }
    if (scene==='play'){
      if (!game.over && !paused){ var jv=joyVec(); if (jv) game.joy(game.active,jv.x,jv.y); var steps=Math.ceil(dt/(1/30)); for (var i=0;i<steps;i++) game.update(dt/steps); }
      updateCam(dt);
      screenT(); ctx.fillStyle='#120a26'; ctx.fillRect(0,0,VW,VH);
      drawWorld(); drawUI(); drawJoy();
      if (paused){ screenT(); ctx.fillStyle='rgba(10,5,22,0.55)'; ctx.fillRect(0,TOP,VW,viewH()); ctx.fillStyle='#fff'; ctx.font='bold 26px '+FONT; ctx.textAlign='center'; ctx.fillText('暂停中',VW/2,TOP+viewH()/2); ctx.font='14px '+FONT; ctx.fillText('按「继续」回到这一夜',VW/2,TOP+viewH()/2+28); }
      if (game.lastToast && game.lastToast!==lastToastSeen){ lastToastSeen=game.lastToast; sfxToast(game.lastToast.msg); }
      if (game.over){ onResult(); drawResult(); }
    }
  }
  window.addEventListener('resize',resize);
  resize();
  loadImages(function(){ requestAnimationFrame(frame); });
  window.__lyg={press:press, tap:tap, get game(){return game;}, get cam(){return cam;}, toScreen:function(x,y){return toScreen(x,y);}, setOverview:function(v){overview=v;}};
})();
</script>
</body></html>
